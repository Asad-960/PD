[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdtt-sandbox"
version = "0.1.0"
description = "Physiological Digital Twin Sandbox - Local Research & Education Platform"
readme = "docs/architecture-explanation.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.30.0",
    "langgraph>=1.2.0,<2.0.0",
    "psutil>=5.9.0",
    "reportlab>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0,<7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
